# GitHub Pages source: Deploy from a branch, wws, / (root).
name: Build and Deploy Scroll

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and Build
        run: |
          npm install -g https://github.com/breck7/scroll/archive/refs/heads/main.tar.gz
          scroll test
          scroll list | scroll build
          mkdir -p _site
          cp *.* CNAME _site/
          touch _site/.nojekyll
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: wws
          folder: _site
